name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get install -y fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python scripts/check_data_paths.py
      - run: python -m pytest -q
      # Oracle trên manifest không ảnh: cận trên phải là escape 0%, recall 100%
      - run: python -m datagen.build --seed 42 --split dev --no-images --out /tmp/syn
      - run: python -m loanpipe.evaluate --split dev --data /tmp/syn --out /tmp/reports --no-file-check
