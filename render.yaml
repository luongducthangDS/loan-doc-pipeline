# Render Blueprint: review UI demo (Dockerfile). Gói free ngủ sau ~15 phút không truy cập, lần mở đầu chờ ~1 phút.
# Kết quả rà soát ghi SQLite trong container, mất khi redeploy/ngủ: chấp nhận cho demo.
services:
  - type: web
    name: loan-doc-pipeline
    runtime: docker
    plan: free
    region: singapore
    branch: agent-mode
    healthCheckPath: /_stcore/health
    envVars:
      - key: REVIEW_DB
        value: /tmp/review.sqlite
